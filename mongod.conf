# Configuration MongoDB pour données médicales
# /etc/mongod.conf

# Stockage
storage:
  dbPath: /data/db
  # IMPORTANT: En production, activer le chiffrement au repos
  # wiredTiger:
  #   engineConfig:
  #     cacheSizeGB: 2

# Réseau
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000
  # En production, limiter à des IPs spécifiques
  # TLS/SSL (à activer en production)
  # tls:
  #   mode: requireTLS
  #   certificateKeyFile: /etc/ssl/mongodb.pem
  #   CAFile: /etc/ssl/ca.pem

# Sécurité
security:
  authorization: enabled  # Active l'authentification RBAC
  # keyFile: /etc/mongodb-keyfile  # Pour les replica sets

# Logging
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  # Audit logging (recommandé pour les données médicales)
  # auditLog:
  #   destination: file
  #   path: /var/log/mongodb/audit.json
  #   format: JSON

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Opérations
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

