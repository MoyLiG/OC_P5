services:
  mongodb_test:
    image: mongo:latest
    container_name: mongodb_test
    restart: unless-stopped
    env_file:
      - .env.test_docker
    ports:
      - "27018:27017"
    volumes:
      - mongodb_test_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./mongod.conf:/etc/mongod.conf:ro
    networks:
      - test_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb_test:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    command: ["mongod", "--config", "/etc/mongod.conf"]

  test_runner:
    image: python:3.11-slim
    container_name: test_runner
    env_file:
      - .env.test_docker
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "set -e &&
      echo '=== Installation des dépendances ===' &&
      pip install --no-cache-dir -r requirements.txt &&
      pip install pytest &&
      echo '' &&
      echo 'En attente de MongoDB...' &&
      until timeout 1s bash -c 'cat < /dev/null > /dev/tcp/mongodb_test/27017' 2>/dev/null; do
        sleep 1
      done &&
      echo 'MongoDB est prêt !' &&
      echo '=== Tests unitaires ===' &&
      python -m pytest tests/test_transfert_csv_mongodb.py -v &&
      python -m pytest tests/test_optimiser_collection.py -v &&
      python -m pytest tests/test_test_integrite_donnees.py -v &&
      python -m pytest tests/test_gestion_utilisateurs.py -v &&
      echo '' &&
      echo '=== Tests intégration - Sécurité RBAC ===' &&
      pytest tests/test_rbac_integration.py -v &&
      echo '' &&
      echo '=== Tests intégration - Migration des données ===' &&
      python scripts/transfert_csv_mongodb.py &&
      python scripts/optimiser_collection.py &&
      python scripts/test_integrite_donnees.py &&
      echo '' &&
      echo '✅ Tous les tests ont réussi !'"
    depends_on:
      mongodb_test:
        condition: service_healthy
    networks:
      - test_network

volumes:
  mongodb_test_data:

networks:
  test_network:
    driver: bridge