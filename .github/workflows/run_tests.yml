name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_INITDB_DATABASE: P5_test
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Initialiser MongoDB RBAC manuellement car on ne peut pas monter de volumes
      - name: Initialize MongoDB RBAC
        env:
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_ADMIN_PASSWORD: ${{ secrets.MONGO_ADMIN_PASSWORD }}
          MONGO_LECTEUR_PASSWORD: ${{ secrets.MONGO_LECTEUR_PASSWORD }}
          MONGO_REDACTEUR_PASSWORD: ${{ secrets.MONGO_REDACTEUR_PASSWORD }}
          MONGO_ADMIN_TEST_PASSWORD: ${{ secrets.MONGO_ADMIN_TEST_PASSWORD }}
        run: |
          sleep 5

          # Copier le script d'initialisation dans le conteneur
          docker cp init-mongo.js $(docker ps -qf "ancestor=mongo:latest"):/tmp/init-mongo.js

          # Exécuter avec authentification root en passant les variables d'env
          docker exec \
            -e MONGO_ADMIN_PASSWORD=$MONGO_ADMIN_PASSWORD \
            -e MONGO_LECTEUR_PASSWORD=$MONGO_LECTEUR_PASSWORD \
            -e MONGO_REDACTEUR_PASSWORD=$MONGO_REDACTEUR_PASSWORD \
            -e MONGO_ADMIN_TEST_PASSWORD=$MONGO_ADMIN_TEST_PASSWORD \
            $(docker ps -qf "ancestor=mongo:latest") mongosh \
            -u root \
            -p $MONGO_ROOT_PASSWORD \
            --authenticationDatabase admin \
            --file /tmp/init-mongo.js

      - name: Run unit tests
        run: |
          python -m pytest tests/test_transfert_csv_mongodb.py -v
          python -m pytest tests/test_optimiser_collection.py -v
          python -m pytest tests/test_test_integrite_donnees.py -v
          python -m pytest tests/test_gestion_utilisateurs.py -v

      - name: Run integration tests - RBAC Security
        env:
          MONGO_URI: "mongodb://root:${{ secrets.MONGO_ROOT_PASSWORD }}@localhost:27017/"
          DB_NAME: "P5_test"
          MONGO_ADMIN_USER: "admin_p5_test"
          MONGO_ADMIN_PASSWORD: ${{ secrets.MONGO_ADMIN_TEST_PASSWORD }}
        run: |
          python scripts/test_rbac_integration.py

      - name: Run integration tests - Data migration
        env:
          MONGO_URI: "mongodb://root:${{ secrets.MONGO_ROOT_PASSWORD }}@localhost:27017/"
          CSV_FILE_PATH: "data/healthcare_dataset.csv"
          DB_NAME: "P5_test"
        run: |
          python scripts/transfert_csv_mongodb.py
          python scripts/optimiser_collection.py
          python scripts/test_integrite_donnees.py