services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      # Persistance des données
      - mongodb_data:/data/db
      # Script d'initialisation RBAC
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      # Configuration MongoDB
      - ./mongod.conf:/etc/mongod.conf:ro
    ports:
      - "27017:27017"
    networks:
      - mongo_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  migration:
    image: python:3.11-slim
    container_name: migration
    volumes:
      - ./data:/data
      - ./scripts:/scripts
      - ./requirements.txt:/requirements.txt
    working_dir: /scripts
    environment:
      ENVIRONMENT: docker
      MONGO_URI: "mongodb://root:example@mongodb:27017/"
      CSV_FILE_PATH: "/data/healthcare_dataset.csv"
      DB_NAME: "P5"
    command: >
      bash -c "set -e &&
      pip install --no-cache-dir -r /requirements.txt &&
      echo 'Vérification de la connexion...' &&
      until timeout 1s bash -c 'cat < /dev/null > /dev/tcp/mongodb/27017' 2>/dev/null; do
        sleep 1
      done &&
      echo 'MongoDB est prêt !' &&
      python -m pytest tests/test_rbac_integration_2.py -k test_connexion_root &&
      python transfert_csv_mongodb.py &&
      python optimiser_collection.py &&
      python test_integrite_donnees.py"
      
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo_network

volumes:
  mongodb_data:

networks:
  mongo_network:
    driver: bridge
