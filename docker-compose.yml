services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./mongod.conf:/etc/mongod.conf:ro
    ports:
      - "27017:27017"
    networks:
      - mongo_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  migration:
    image: python:3.11-slim
    container_name: migration
    env_file:
      - .env.docker
    volumes:
      - ./data:/data
      - ./scripts:/scripts
      - ./requirements.txt:/requirements.txt
    working_dir: /scripts
    command: >
      bash -c "set -e &&
      pip install --no-cache-dir -r /requirements.txt &&
      echo 'Vérification de la connexion...' &&
      until timeout 1s bash -c 'cat < /dev/null > /dev/tcp/mongodb/27017' 2>/dev/null; do
        sleep 1
      done &&
      echo 'MongoDB est prêt !' &&
      echo '=== Migration des données ===' &&
      python transfert_csv_mongodb.py &&
      python optimiser_collection.py &&
      python test_integrite_donnees.py &&
      echo 'Migration terminée avec succès !'"

    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo_network

volumes:
  mongodb_data:

networks:
  mongo_network:
    driver: bridge